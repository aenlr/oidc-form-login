stages:
  - build
  - release

variables:
  GLAB_CLI_IMAGE: registry.gitlab.com/gitlab-org/cli:latest
  PYTHON_IMAGE: ${DOCKER_HUB_PROXY}python:3.13-slim

build:
  stage: build
  image: ${PYTHON_IMAGE}
  script: |
    if [[ "$CI_COMMIT_TAG" =~ v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
      ./scripts/build-dist.sh "${CI_COMMIT_TAG#v}"
    else
      ./scripts/build-dist.sh
    fi
  artifacts:
    name: dist
    paths:
      - dist-*/*

release:
  stage: release
  image: ${GLAB_CLI_IMAGE}
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+(\.[0-9]+)?$/
    - when: never
  before_script:
    - glab auth login --hostname $CI_SERVER_HOST  --job-token $CI_JOB_TOKEN
  script:
    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "Release ${CI_COMMIT_TAG#v}" \
        --notes-file CHANGELOG.md \
        --use-package-registry \
        ./dist-*/*
