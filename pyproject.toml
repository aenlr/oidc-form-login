[project]
name = "oidc-form-login"
version = "0.3"
authors = [ { name = "Anders Norlander" } ]
requires-python = ">=3.13,<3.15"
description = "Login via forms"
urls = {}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "beautifulsoup4",
    "keyring>=25.7.0",
    "pip_system_certs",
    "requests",
    "secretstorage>=3.5.0",
    "urllib3>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]",
    "mypy",
    "pre-commit",
    "pylint",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-requests",
    "urllib3"
]
packaging = [
    "pyinstaller"
]

[project.scripts]
oidc-form-login = "oidc_form_login.login:main"
gangway-login = "oidc_form_login.gangway:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.14"]
build-backend = "uv_build"

###
### [tool.ruff]
### https://docs.astral.sh/ruff/settings/
[tool.ruff]
line-length = 99
format.line-ending = "lf"

###
### [tool.mypy]
### https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
ignore_missing_imports = true

###
### [tool.pytest]
### https://docs.pytest.org/en/6.2.x/customize.html#
[tool.pytest.ini_options]
pythonpath = "src"
addopts = [
    "--import-mode=importlib",
    "--doctest-modules"
]

###
### [tool.pylint]
### https://pylint.readthedocs.io/en/latest/user_guide/configuration/all-options.html
[tool.pylint]
max-branches = 20
ignore = "setup.py"

###
### [tool.coverage]
### https://coverage.readthedocs.io/en/6.5.0/config.html
[tool.coverage.run]
source = [
    "src",
#    "tests"
]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.report]
show_missing = true
precision = 2
